        <section class="dock" aria-label="Narration controls">
          <fieldset class="voices">
            <legend>Voice</legend>
            <label class="voice">
              <input
                type="radio"
                name="voice"
                value="/audio/austin-texas.mp3"
                data-name="Austin"
                checked
              />
              <span>Austin</span>
            </label>
            <label class="voice">
              <input
                type="radio"
                name="voice"
                value="/audio/grandpa-spuds-oxley.mp3"
                data-name="Grandpa Spuds"
              />
              <span>Grandpa Spuds</span>
            </label>
          </fieldset>

          <div class="transport">
            <button
              class="icon-btn"
              type="button"
              data-action="restart"
              aria-label="Restart"
              title="Restart (R)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 12a8 8 0 1 0 2.35-5.65M4 4v4h4" />
              </svg>
            </button>

            <button
              class="play-btn"
              type="button"
              data-action="toggle"
              aria-label="Play"
              aria-pressed="false"
              title="Play / pause (Space)"
            >
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.5v13l10.5-6.5z" />
              </svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
              </svg>
              <span class="spinner" aria-hidden="true"></span>
            </button>

            <div class="timeline">
              <input
                class="scrubber"
                type="range"
                min="0"
                max="0"
                step="0.01"
                value="0"
                aria-label="Seek"
              />
              <div class="times">
                <span data-elapsed>0:00</span><span data-duration>0:00</span>
              </div>
            </div>
          </div>

          <p class="status" data-status role="status" aria-live="polite"></p>
        </section>
